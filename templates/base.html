<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Altcoin Shadow System{% endblock %}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v={{ range(1, 100000) | random }}">
  
  <!-- Dynamic Styles block for children -->
  {% block styles %}{% endblock %}
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <i data-lucide="shield-alert" class="purple" style="width: 20px; height: 20px;"></i>
        <span>ALTCOIN <span class="brand-accent">SHADOW</span></span>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="nav-links">
        <a href="/" id="nav-dashboard"><i data-lucide="layout-dashboard" style="width: 14px; height: 14px;"></i>仪表盘</a>
        <a href="/weekly-report" id="nav-weekly-report"><i data-lucide="trending-up" style="width: 14px; height: 14px;"></i>周报</a>
        <a href="/batch-backtest" id="nav-batch-backtest"><i data-lucide="layers" style="width: 14px; height: 14px;"></i>批量回测</a>
        <a href="/backtest" id="nav-backtest"><i data-lucide="play" style="width: 14px; height: 14px;"></i>单币回测</a>
        <a href="/signal-scores" id="nav-signal-scores"><i data-lucide="star" style="width: 14px; height: 14px;"></i>信号评分</a>
      </nav>
      
      <!-- Actions -->
      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="btn-secondary" style="padding: 6px; border-radius: 50%;" title="切换主题">
          <i id="theme-icon" data-lucide="sun" style="width: 16px; height: 16px;"></i>
        </button>
        
        <!-- Log Drawer Toggle -->
        <button id="notification-toggle" class="btn-secondary" style="padding: 6px 12px; border-radius: 6px;" title="系统事件日志">
          <div style="display: flex; align-items: center; gap: 6px;">
            <i data-lucide="bell" style="width: 16px; height: 16px;"></i>
            <span class="badge badge-purple" id="events-count-badge">0</span>
          </div>
        </button>
        
        <!-- Live status -->
        <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--font-mono); color: var(--success);" id="connection-status">
          <span style="display:inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: var(--success);"></span>
          <span>CONNECTED</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
    
    <!-- Mobile Bottom Tab Bar -->
    <div class="mobile-tab-bar">
      <a href="/" class="mobile-tab-item" id="tab-dashboard">
        <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
        <span>大盘</span>
      </a>
      <a href="/weekly-report" class="mobile-tab-item" id="tab-weekly-report">
        <i data-lucide="trending-up" style="width: 18px; height: 18px;"></i>
        <span>周报</span>
      </a>
      <a href="/batch-backtest" class="mobile-tab-item" id="tab-batch-backtest">
        <i data-lucide="layers" style="width: 18px; height: 18px;"></i>
        <span>批回测</span>
      </a>
      <a href="/backtest" class="mobile-tab-item" id="tab-backtest">
        <i data-lucide="play" style="width: 18px; height: 18px;"></i>
        <span>单回测</span>
      </a>
      <a href="/signal-scores" class="mobile-tab-item" id="tab-signal-scores">
        <i data-lucide="star" style="width: 18px; height: 18px;"></i>
        <span>评分</span>
      </a>
    </div>

    <!-- Notification / Events Drawer Sliding Panel -->
    <aside class="notification-panel" id="notification-panel">
      <div class="notification-header">
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
          <i data-lucide="terminal" class="purple" style="width: 16px; height: 16px;"></i>
          <span>系统实时事件日志</span>
        </div>
        <button id="notification-close" class="btn-secondary" style="padding: 4px; border-radius: 50%;">
          <i data-lucide="x" style="width: 16px; height: 16px;"></i>
        </button>
      </div>
      <div class="notification-list" id="events-list-container">
        <!-- Events injected by app.js -->
        <div class="empty-state">
          <i data-lucide="info" style="width: 24px; height: 24px;" class="empty-state-icon"></i>
          <span>暂无系统实时日志</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v={{ range(1, 100000) | random }}" defer></script>
  
  {% block scripts %}{% endblock %}

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Highlight navigation
      const path = window.location.pathname;
      const navIds = {
        "/": ["nav-dashboard", "tab-dashboard"],
        "/weekly-report": ["nav-weekly-report", "tab-weekly-report"],
        "/batch-backtest": ["nav-batch-backtest", "tab-batch-backtest"],
        "/backtest": ["nav-backtest", "tab-backtest"],
        "/signal-scores": ["nav-signal-scores", "tab-signal-scores"]
      };

      if (navIds[path]) {
        navIds[path].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.add("active");
        });
      }

      // Lucide icons initialization
      if (typeof lucide !== "undefined") {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
