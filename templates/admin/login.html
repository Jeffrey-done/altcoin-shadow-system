{% extends "admin/_base.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="card">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="width:56px;height:56px;border-radius:var(--radius-lg);background:var(--accent-subtle);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
      <i data-lucide="shield-check" style="width:28px;height:28px;color:var(--accent);"></i>
    </div>
    <h2 style="margin-bottom:4px;">管理员登录</h2>
    <p class="muted" style="font-size:0.78rem;">影子交易系统</p>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div style="margin-bottom:16px;">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required autofocus
             autocomplete="current-password" placeholder="请输入管理员密码">
    </div>

    <div style="margin-bottom:24px;">
      <label for="totp">动态验证码（6位数字）</label>
      <input type="text" id="totp" name="totp" pattern="[0-9]{6}" maxlength="6"
             inputmode="numeric" autocomplete="one-time-code"
             placeholder="验证器6位数字">
    </div>

    <button type="submit" class="btn-primary" style="width:100%;padding:14px;">
      <i data-lucide="log-in" style="width:16px;height:16px;"></i>
      登录
    </button>
  </form>

  <p class="muted" style="margin-top:24px;font-size:0.7rem;text-align:center;">
    连续5次失败将锁定IP 30分钟
  </p>
</div>
{% endblock %}
