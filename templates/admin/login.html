{% extends "admin/_base.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 60px auto;">
  <h2>🔐 管理员登录</h2>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="password">密码</label>
    <input type="password" id="password" name="password" required autofocus
           autocomplete="current-password">

    <div style="height: 14px;"></div>

    <label for="totp">TOTP 动态码（6 位）</label>
    <input type="text" id="totp" name="totp" pattern="[0-9]{6}" maxlength="6"
           inputmode="numeric" autocomplete="one-time-code"
           placeholder="Google Authenticator 6 位数字">

    <div style="height: 20px;"></div>

    <button type="submit" style="width: 100%;">登录</button>
  </form>

  <p class="muted" style="margin-top: 20px; font-size: 12px;">
    连续登录失败 5 次将锁定该 IP 30 分钟，锁定期内页面不再响应。
  </p>
</div>
{% endblock %}
