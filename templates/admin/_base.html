<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Admin{% endblock %}</title>
<style>
  /* 自包含样式，不引用外部资源（CSP 友好） */
  :root {
    --bg: #0b0d12;
    --panel: #151924;
    --panel-2: #1e2330;
    --border: #2a3040;
    --text: #e8ecf4;
    --text-dim: #8a93a6;
    --accent: #4a9eff;
    --danger: #ff5a5a;
    --warn: #ffb84a;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 18px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .card h3 { font-size: 15px; margin: 20px 0 10px; color: var(--text-dim); }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-dim); }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  input[type=checkbox] { width: 18px; height: 18px; vertical-align: middle; }
  button, .btn {
    background: var(--accent);
    color: white;
    border: 0;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--panel-2); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); }
  .btn-warn { background: var(--warn); color: #000; }
  .error {
    background: rgba(255, 90, 90, 0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .ok {
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid var(--ok);
    color: var(--ok);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .muted { color: var(--text-dim); font-size: 13px; }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .row > label { flex: 0 0 200px; margin-bottom: 0; }
  .row > input, .row > select { flex: 1; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  code, .mono {
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  .warn-banner {
    background: rgba(255, 184, 74, 0.12);
    border: 1px solid var(--warn);
    color: var(--warn);
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
