<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>{% block title %}管理面板{% endblock %}</title>
<style>
/* ── Admin Design Tokens (unified with main theme) ────────────── */
:root, [data-theme="dark"] {
    --bg-body: #06080c;
    --bg-surface: #0d1117;
    --bg-card: rgba(13, 17, 23, 0.8);
    --bg-card-hover: rgba(22, 27, 34, 0.9);
    --bg-input: rgba(0, 0, 0, 0.4);
    --bg-elevated: rgba(255, 255, 255, 0.04);
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-default: rgba(255, 255, 255, 0.12);
    --border-focus: #58a6ff;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --accent-subtle: rgba(88, 166, 255, 0.1);
    --green: #3fb950;
    --green-subtle: rgba(63, 185, 80, 0.1);
    --red: #f85149;
    --red-subtle: rgba(248, 81, 73, 0.1);
    --yellow: #d29922;
    --yellow-subtle: rgba(210, 153, 34, 0.1);
    --purple: #a371f7;
    --purple-subtle: rgba(163, 113, 247, 0.1);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --overlay: rgba(0, 0, 0, 0.75);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    background: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

/* ── Card ── */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 32px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
}
.card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 60%);
    pointer-events: none; border-radius: inherit;
}

/* ── Forms ── */
label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 12px 16px;
    background: var(--bg-input); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); color: var(--text-primary);
    font: inherit; font-size: 0.88rem;
    transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

/* ── Button ── */
button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--radius-md);
    font: inherit; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.2s;
}
button:hover { filter: brightness(1.1); transform: translateY(-1px); }
button:active { transform: translateY(0); }
.btn-primary { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: white; }
.btn-ghost { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); }
.btn-ghost:hover { border-color: var(--text-secondary); color: var(--text-primary); }

/* ── Utilities ── */
.error {
    background: var(--red-subtle); border: 1px solid rgba(239,68,68,0.3);
    color: var(--red); padding: 12px 16px; border-radius: var(--radius-md);
    font-size: 0.82rem; margin-bottom: 16px;
}
.muted { color: var(--text-muted); }
h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.02em; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}
<div style="max-width:480px;margin:0 auto;padding:40px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;">
  {% block content %}{% endblock %}
</div>
{% endblock %}
{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
