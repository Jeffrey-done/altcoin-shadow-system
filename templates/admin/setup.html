{% extends "admin/_base.html" %}
{% block title %}Initial Setup{% endblock %}
{% block content %}
<div class="card">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="width:56px;height:56px;border-radius:var(--radius-lg);background:var(--purple-subtle);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
      <i data-lucide="key-round" style="width:28px;height:28px;color:var(--purple);"></i>
    </div>
    <h2 style="margin-bottom:4px;">First Time Setup</h2>
    <p class="muted" style="font-size:0.78rem;">Set admin password and bind TOTP authenticator</p>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div style="margin-bottom:16px;">
      <label for="password">Admin Password (min 12 chars)</label>
      <input type="password" id="password" name="password" required minlength="12"
             autocomplete="new-password" placeholder="Strong password">
    </div>

    <div style="margin-bottom:16px;">
      <label for="password_confirm">Confirm Password</label>
      <input type="password" id="password_confirm" name="password_confirm" required minlength="12"
             autocomplete="new-password" placeholder="Repeat password">
    </div>

    <div style="margin-bottom:20px;padding:16px;background:var(--bg-elevated);border-radius:var(--radius-md);text-align:center;">
      <p style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:10px;">Scan with Google Authenticator / Authy:</p>
      <div style="background:white;display:inline-block;padding:12px;border-radius:var(--radius-sm);">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data={{ otpauth_url | urlencode }}" 
             width="180" height="180" alt="TOTP QR" style="display:block;">
      </div>
      <p style="font-size:0.68rem;color:var(--text-muted);margin-top:10px;word-break:break-all;">
        Manual key: <code style="color:var(--accent);">{{ totp_secret }}</code>
      </p>
    </div>

    <div style="margin-bottom:24px;">
      <label for="totp">Verify TOTP Code</label>
      <input type="text" id="totp" name="totp" pattern="[0-9]{6}" maxlength="6"
             inputmode="numeric" required placeholder="Enter 6-digit code to verify">
    </div>

    <button type="submit" class="btn-primary" style="width:100%;padding:14px;">
      <i data-lucide="check-circle" style="width:16px;height:16px;"></i>
      Complete Setup
    </button>
  </form>
</div>
{% endblock %}
