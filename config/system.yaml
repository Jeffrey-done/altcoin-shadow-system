# 系统配置
# 运行时、调度、交易所、部署相关

# ══════════════════════════════════════════════════════════════════
#  全局账户 & 模式（向后兼容）
# ══════════════════════════════════════════════════════════════════
account:
  live_mode: false             # 全局实盘总开关
  shadow_parallel: true        # 实盘时保留影子交易对照
  position_mode: manual        # manual | proportional
  baseline_balance: 100        # 比例模式基准本金

# ══════════════════════════════════════════════════════════════════
#  交易所配置 — 每个交易所独立账户
#  每个交易所拥有自己的资金池、杠杆、仓位、风控参数
#
#  本文件是"项目级用户配置"（优先级第3层）。
#  合并优先级（高→低）：
#    1. runtime_config.json（admin panel 实时修改）
#    2. admin_secrets.json settings（凭证附带配置）
#    3. 本文件 config/system.yaml（项目级默认）
#    4. config/_defaults.py EXCHANGE_ACCOUNTS（代码层兜底）
#  修改本文件后重启服务即可生效；无需改代码。
# ══════════════════════════════════════════════════════════════════
exchanges:
  binance:
    enabled: true
    # 账户参数（独立于其他交易所）
    account_balance: 100         # 该交易所账户本金 (USDT) — 你只需设这一个
    max_open_trades: 3           # 最大同时持仓数
    leverage: 10                 # 杠杆倍数
    # default_stake: 30          # ← 已废弃，系统自动计算: account_balance / max_open_trades
    slippage_alert_pct: 1.0      # 滑点告警阈值 (%)
    # 风控参数（每个交易所独立风控）
    risk:
      max_daily_loss: 30         # 单日最大亏损 (USDT)
      max_daily_trades: 3        # 单日最大开仓次数
      consecutive_loss_pause: 3  # 连亏暂停阈值
      max_position_pct: 0.5      # 最大持仓占比
      cooldown_hours: 24         # 止损后冷却期 (h)
    # 复利策略
    compound:
      enabled: true
      step: 50                   # 每累计盈利 N U 步进
      increase: 25               # 每步增加的保证金 (U)
      max_stake: 300             # 单笔保证金上限 (U)
    # 止盈止损
    tp_sl:
      tp1_multiplier: 0.95       # TP1 价格乘数 (做空 -5%)
      tp2_multiplier: 0.92       # TP2 价格乘数 (做空 -8%)
      tp1_close_ratio: 0.5       # TP1 平仓比例
      hard_stop_loss_pct: 5.0    # 硬止损 (%)

  okx:
    enabled: true
    live_mode: false             # OKX 独立实盘开关
    cross_validate: false        # 是否用作交叉验证数据源
    # 账户参数
    account_balance: 100         # OKX 账户本金 (USDT)
    max_open_trades: 3           # 最大同时持仓数
    leverage: 10                 # OKX 杠杆倍数
    # default_stake: 30          # ← 已废弃，系统自动计算
    slippage_alert_pct: 1.0
    # 风控参数
    risk:
      max_daily_loss: 30
      max_daily_trades: 3
      consecutive_loss_pause: 3
      max_position_pct: 0.5
      cooldown_hours: 24
    # 复利策略
    compound:
      enabled: true
      step: 50
      increase: 25
      max_stake: 300
    # 止盈止损
    tp_sl:
      tp1_multiplier: 0.95
      tp2_multiplier: 0.92
      tp1_close_ratio: 0.5
      hard_stop_loss_pct: 5.0

  gate:
    enabled: true
    live_mode: false             # Gate.io 独立实盘开关
    # 账户参数
    account_balance: 100         # Gate.io 账户本金 (USDT)
    max_open_trades: 3           # 最大同时持仓数
    leverage: 10                 # Gate.io 杠杆倍数
    # default_stake: 30          # ← 已废弃，系统自动计算
    slippage_alert_pct: 1.0
    # 风控参数
    risk:
      max_daily_loss: 30
      max_daily_trades: 3
      consecutive_loss_pause: 3
      max_position_pct: 0.5
      cooldown_hours: 24
    # 复利策略
    compound:
      enabled: true
      step: 50
      increase: 25
      max_stake: 300
    # 止盈止损
    tp_sl:
      tp1_multiplier: 0.95
      tp2_multiplier: 0.92
      tp1_close_ratio: 0.5
      hard_stop_loss_pct: 5.0

  # 实盘路由（多交易所都开启实盘时生效）
  routing:
    primary_exchange: binance    # binance | okx | gate | both | auto
    primary_fallback: binance    # auto 模式下两所都有合约时选谁
    price_divergence_max_pct: 2.0

# 候选池管理
candidates:
  expire_hours: 12                       # 未触发候选过期时间（小时）
  check_open_exec_timeout_sec: 45        # 开仓执行阶段总超时（秒）
  check_hard_timeout_sec: 120            # 候选确认函数级硬超时（秒）

# 自动优化
auto_optimize:
  enabled: true
  day: 0                                 # 周几运行（0=周一）

# 复利（全局默认，交易所级覆盖见 exchanges 段）
compound:
  enabled: true
  step: 50
  increase: 25
  max_stake: 300

# 调度器
scheduler:
  task_timeout_seconds: 600
  check_candidates_interval_minutes: 5
  check_candidates_budget_sec: 480
  check_candidates_per_candidate_sec: 30
  check_candidates_parallelism: 4

# 数据库
database:
  engine: sqlite               # sqlite | postgresql
  # PostgreSQL 配置（engine=postgresql 时生效）
  # host: localhost
  # port: 5432
  # user: altcoin
  # password: altcoin
  # name: altcoin_shadow

# 通知
notifications:
  telegram:
    enabled: true
  ws_disconnect_alert_minutes: 5

# 回测
backtest:
  slippage_pct: 0.1
  fee_pct: 0.04
  default_days: 90
  correlation_threshold: 0.7             # 高于此值的币对避免同时开仓
  symbols:
    - PEPE/USDT
    - DOGE/USDT
    - SHIB/USDT
    - FLOKI/USDT
    - BONK/USDT
    - WIF/USDT
    - PEOPLE/USDT
    - ORDI/USDT
    - FET/USDT
    - RNDR/USDT
    - INJ/USDT
    - SEI/USDT
    - SUI/USDT
    - APT/USDT
    - ARB/USDT
    - OP/USDT
    - NEAR/USDT
    - FIL/USDT
    - RUNE/USDT
    - TIA/USDT

# 周报
weekly_report:
  enabled: true
  roi_grade_a: 15
  roi_grade_b: 5
  roi_grade_c: 0

# 交易归档
archive:
  days: 30
