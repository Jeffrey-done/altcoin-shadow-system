# 策略配置
# 每个策略一个顶层 key，参数与 strategies/*/params.py 对应

short_overbought:
  enabled: true
  version: "5.0.0"

  # 扫描过滤
  scan:
    vol_min: 500000
    price_max: 50.0            # 扩展至中盘币 ($1~$50)
    pct_24h_min: 10

  # RSI 参数
  rsi:
    period: 14
    daily_min: 75
    h4_enter: 70
    h4_drop: 10
    h4_peak_lookback: 10

  # 妖币识别
  yao:
    oi_change_min: 0.30
    funding_max: 0.05
    funding_min: -0.03
    funding_hot: 0.03

  # 弃盘点
  abandon:
    body_drop_pct: 3
    consecutive: 2
    oi_drop_pct: 0.02

  # 止盈止损
  exits:
    tp1_pct: 5.0
    tp2_pct: 8.0
    tp1_close_ratio: 0.5
    hard_stop_pct: 5.0
    trail_activate_pct: 3.0
    trail_retrace_ratio: 0.4
    max_hold_hours: 24

  # 信号评分阈值
  scoring:
    full_threshold: 70
    half_threshold: 40
    skip_threshold: 40

  # BTC 趋势过滤
  btc_filter:
    enabled: true
    crash_threshold: -5.0
    pump_threshold: 8.0

  # OKX 交叉验证
  okx_cross:
    enabled: false
    bonus: 8

  # 仓位
  position:
    default_stake: 30
    leverage: 10


# ══════════════════════════════════════════════════════════════════
#  Funding Rate 套利策略（历史归档，v4.0 移除）
# ══════════════════════════════════════════════════════════════════
# v4.0 时存在的 funding_arb 策略已在 v4.1 整体移除。v5.x 多策略架构
# 不再包含此策略；如需重建请新建 strategies/funding_arb/ 目录并实现 BaseStrategy。
# 本节仅保留 enabled=false 占位，避免外部历史脚本读取时崩溃。
funding_arb:
  enabled: false  # ARCHIVED: removed in v4.1, not in v5.x StrategyRegistry
  version: "1.0.0-archived"


# ══════════════════════════════════════════════════════════════════
#  超卖做多策略 (v5.x 多策略架构启用)
# ══════════════════════════════════════════════════════════════════
long_oversold:
  enabled: true                        # v5.x 多策略架构启用
  version: "5.0.0"

  # 扫描过滤
  scan:
    vol_min: 1000000
    price_max: 5.0
    pct_24h_max: -15                   # 24h 跌幅超过 15%

  # RSI 参数
  rsi:
    period: 14
    daily_max: 25                      # 日线 RSI < 25 = 超卖
    h4_enter: 30                       # 4h RSI 反弹进入阈值
    h4_rise: 8                         # 4h RSI 需从谷值回升的点数

  # 止盈止损
  exits:
    tp1_pct: 5.0
    tp2_pct: 10.0
    tp1_close_ratio: 0.5
    hard_stop_pct: 4.0
    trail_activate_pct: 3.0
    trail_retrace_ratio: 0.4
    max_hold_hours: 48

  # 仓位
  position:
    default_stake: 20
    leverage: 5

# ══════════════════════════════════════════════════════════════════
#  Pre-Pump 嗅探做多策略
# ══════════════════════════════════════════════════════════════════
prepump_sniffer:
  enabled: true
  version: "1.0.0"

  scan:
    vol_min: 500000
    price_max: 1.0
    price_change_max: 5.0

  anomaly:
    vol_spike_ratio: 2.0
    price_calm_pct: 3.0
    oi_spike_pct: 2.5
    funding_shift: 0.015
    bb_squeeze_pctile: 55.0
    signal_threshold: 3

  breakout:
    breakout_lookback: 12
    breakout_pct: 0.3
    breakout_vol_mult: 1.2
    breakout_wait_bars: 18

  exits:
    tp1_pct: 6.0
    tp2_pct: 18.0
    tp1_close_ratio: 0.5
    hard_stop_pct: 5.5
    trail_activate_pct: 8.0
    trail_retrace_ratio: 0.35
    max_hold_hours: 36

  position:
    default_stake: 30
    leverage: 5


# ══════════════════════════════════════════════════════════════════
#  宏观信号整合（multi-signal + Crypto-Market-Monitor）
# ══════════════════════════════════════════════════════════════════
macro:
  enabled: true                        # 是否启用宏观信号过滤

  # multi-signal 配置
  ms_signal_path: ''                   # 留空则自动搜索常见路径
  ms_stale_minutes: 120                # MS 数据超过此时间视为过期

  # Crypto-Market-Monitor 配置
  cmm_enabled: true                    # 是否启用 CMM 决策
  cmm_output_path: ''                  # CMM 输出文件路径（留空则尝试直接调用）
  cmm_stale_minutes: 30                # CMM 数据超过此时间视为过期

  # 环境判断阈值
  thresholds:
    bullish_ms_score: 30               # MS ≥ 此值视为看多环境
    extreme_bullish_ms_score: 60       # MS ≥ 此值视为极度看多（暂停做空）
    bearish_ms_score: -30              # MS ≤ 此值视为看空环境（做空增强）
    extreme_bearish_ms_score: -60      # MS ≤ 此值视为极度看空

  # 仓位调节
  bullish_stake_multiplier: 0.5        # 看多环境下做空仓位乘数
  bearish_stake_multiplier: 1.2        # 看空环境下做空仓位乘数
  bearish_score_bonus: 5               # 看空环境下信号加分
  extreme_bearish_score_bonus: 10      # 极度看空环境下信号加分
  smart_money_bonus: 5                 # Smart Money 看空时额外加分

  # 缓存
  cache_ttl_sec: 60                    # 宏观信号缓存时间
