version: '3.8'

services:
  # 实时仪表盘
  dashboard:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    command: python3 dashboard.py

  # 定时任务调度器（扫描+追踪+费率+做多+健康检查）
  scheduler:
    build: .
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    command: python3 scheduler.py
    depends_on:
      - dashboard
