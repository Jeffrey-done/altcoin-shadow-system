
# 代码通过 Dockerfile 的 COPY 打进镜像。
# 只把数据文件和 .env 作为 volume 挂入，避免三个容器共享源代码/__pycache__ 冲突。
#
# ⚠️ 首次部署前，请在宿主机运行以下命令初始化数据文件：
#   for f in altcoin_shadow_trades altcoin_candidates risk_state altcoin_trades_archive weekly_report; do
#     [ -f "./${f}.json" ] || echo '{}' > "./${f}.json"
#   done
#   mkdir -p ./backtest_cache
#
# docker-entrypoint.sh 也会在容器内做相同检查，但宿主机文件必须先存在，
# 否则 Docker bind mount 会把缺失路径创建为目录。

x-common-app: &common-app
  build: .
  env_file: .env
  environment:
    - REDIS_URL=redis://redis:6379/0
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    # 运行时数据文件（持仓/风控/候选池）
    # docker-entrypoint.sh 会在容器启动时自动初始化缺失的 JSON 文件
    - ./altcoin_shadow_trades.json:/app/altcoin_shadow_trades.json
    - ./altcoin_candidates.json:/app/altcoin_candidates.json
    - ./risk_state.json:/app/risk_state.json
    - ./altcoin_trades_archive.json:/app/altcoin_trades_archive.json
    - ./weekly_report.json:/app/weekly_report.json
    - ./backtest_cache:/app/backtest_cache
    # admin 面板 / runtime 状态（必须挂出来！否则 docker compose build 后丢失）
    # 首次部署前请在宿主机执行：
    #   touch ./runtime_config.json && echo '{}' > ./runtime_config.json && chmod 600 ./runtime_config.json
    #   touch ./admin_secrets.json  && chmod 600 ./admin_secrets.json
    #   touch ./admin_audit.log     && chmod 600 ./admin_audit.log
    #   touch ./.admin_ratelimit.json && echo '{}' > ./.admin_ratelimit.json && chmod 600 ./.admin_ratelimit.json
    - ./runtime_config.json:/app/runtime_config.json
    - ./admin_secrets.json:/app/admin_secrets.json
    - ./admin_audit.log:/app/admin_audit.log
    - ./.admin_ratelimit.json:/app/.admin_ratelimit.json
    # 环境变量
    - ./.env:/app/.env:ro
  restart: unless-stopped

services:
  # ══════════════════════════════════════════════════════════════════
  #  基础设施
  # ══════════════════════════════════════════════════════════════════

  # Redis — 事件总线 + 缓存层
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ══════════════════════════════════════════════════════════════════
  #  应用服务
  # ══════════════════════════════════════════════════════════════════

  # 实时仪表盘
  dashboard:
    <<: *common-app
    environment:
      - ALLOW_INSECURE_DASHBOARD=1
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    command: python3 dashboard.py

  # 异步策略引擎（v2.0 生产级调度器，替代 scheduler）
  scheduler:
    <<: *common-app
    command: python3 async_engine.py
    depends_on:
      redis:
        condition: service_healthy
      dashboard:
        condition: service_started

  # 旧版同步调度器已删除（scheduler.py removed in code-audit phase 2）
  # 如需回退，请从 git history 恢复 scheduler.py 并取消下方注释
  # scheduler-legacy:
  #   <<: *common-app
  #   command: python3 scheduler.py
  #       condition: service_healthy
  #     dashboard:
  #       condition: service_started
  #   profiles:
  #     - legacy

  # 实时止盈止损监控器
  realtime-monitor:
    <<: *common-app
    command: python3 realtime_monitor.py
    depends_on:
      redis:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  redis-data:
