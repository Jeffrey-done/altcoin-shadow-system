# Alembic 配置文件
# 数据库迁移工具 — 用于生产环境的 schema 版本管理

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库 URL（通过 env.py 从环境变量读取，这里只是默认值）
sqlalchemy.url = sqlite:///./altcoin_shadow.db

# 迁移文件命名模板
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# 时区
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
