name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.7.1

      - name: Run ruff syntax check (blocking)
        # E9 = syntax errors only — 这些必须 pass
        run: ruff check --select E9 --output-format=concise .

      - name: Run ruff strict check (non-blocking, informational)
        # F63/F7/F82/F8 真实 bug 检查 — 当前有 3 个预先存在的 warning,
        # 改为非阻塞,后续 PR 逐个清理。绿色才能升级到 blocking。
        continue-on-error: true
        run: ruff check --select F63,F7,F82,F821,F823 --output-format=concise .

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=term \
            --cov-report=xml \
            --cov-config=.coveragerc

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
